name: Demo cada 5 minutos

# Los cron de GitHub se retrasan horas en repos gratuitos, así que la demo corre en un
# bucle dentro de un job de ~5,5 h (scripts/bucle_demo.sh) que se relanza solo al terminar.
# El cron horario es solo un respaldo por si la cadena se corta.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: demo
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bucle de la demo
        env:
          GH_TOKEN: ${{ github.token }}
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
          BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
        run: bash scripts/bucle_demo.sh
