name: Descargar velas intradía

on:
  workflow_dispatch:
    inputs:
      dias:
        description: "Días hacia atrás (o extra4h para las criptos extra en 4H)"
        default: "365"

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/descargar_intradia.py ${{ inputs.dias }}
      - name: Guardar
        run: |
          git config user.name "analizador-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intradia
          git commit -q -m "Velas intradía de 5 minutos" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
