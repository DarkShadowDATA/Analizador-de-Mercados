name: Actualizar datos y publicar web

on:
  schedule:
    - cron: "7 * * * *"      # cada hora, minuto 7 (UTC)
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano
  push:
    branches: [main]
    paths: ["analizador/**", "scripts/**", "docs/*.html", "docs/*.js", "docs/*.css", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Pruebas
        run: python -m pytest -q

      - name: Descargar datos
        run: python scripts/actualizar_datos.py

      - name: Guardar datos en el repositorio
        run: |
          git config user.name "analizador-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -q -m "Datos actualizados $(date -u +'%Y-%m-%d %H:%M') UTC"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
